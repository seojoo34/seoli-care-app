<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설이 케어 일지</title>
    <style>
        /* 예쁜 감성 메모장 & 펫테리어 디자인 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #FDFBF7; margin: 0; padding: 25px 20px; color: #4A2B1D; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .title { font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        
        /* 날짜 조작부 디자인 */
        .date-control { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .date-btn { background: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; color: #FF9B6A; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .date-btn:active { background: #FF9B6A; color: white; }
        .date-display { font-size: 16px; color: #666; font-weight: 700; background: #F0EDE5; padding: 6px 20px; border-radius: 20px; min-width: 110px; }
        
        .task-list { background: white; border-radius: 24px; padding: 10px 20px; box-shadow: 0 8px 20px rgba(74, 43, 29, 0.04); }
        .task-item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px dashed #F0EDE5; cursor: pointer; transition: 0.2s ease-in-out; }
        .task-item:last-child { border-bottom: none; }
        
        .icon-box { width: 46px; height: 46px; background: #F8F6F0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 18px; transition: 0.3s; }
        .task-text { font-size: 17px; font-weight: 700; flex: 1; transition: 0.2s; }
        .status { font-size: 13px; color: #CCC; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: #FAFAFA; }
        
        /* 완료되었을 때 */
        .task-item.completed .icon-box { background: #FF9B6A; color: white; transform: scale(1.1) rotate(-10deg); box-shadow: 0 4px 10px rgba(255, 155, 106, 0.3); }
        .task-item.completed .task-text { text-decoration: line-through; color: #C4B9B3; }
        .task-item.completed .status { color: white; background: #FF9B6A; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🐾 설이 케어 일지</div>
        <div class="date-control">
            <button class="date-btn" id="prevBtn">◀</button>
            <div class="date-display" id="todayDate">로딩중...</div>
            <button class="date-btn" id="nextBtn">▶</button>
        </div>
    </div>
    
    <div class="task-list" id="taskList">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFTY-sXWWT2ni5Lyq90iFqCvBw8LEuhok",
            authDomain: "seoli-care.firebaseapp.com",
            databaseURL: "https://seoli-care-default-rtdb.firebaseio.com",
            projectId: "seoli-care",
            storageBucket: "seoli-care.firebasestorage.app",
            messagingSenderId: "729701318985",
            appId: "1:729701318985:web:85565cb3354ee3ff959a98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentDate = new Date();
        let currentListener = null;

        // 점심 밥 주기 항목이 2번째에 추가되었습니다!
        const defaultTasks = {
            "task1": { text: "아침 밥 주기", icon: "🥣", done: false },
            "task2": { text: "점심 밥 주기", icon: "🥫", done: false },
            "task3": { text: "저녁 밥 주기", icon: "🍖", done: false },
            "task4": { text: "오늘의 산책", icon: "🦮", done: false },
            "task5": { text: "간식 챙겨주기", icon: "🦴", done: false },
            "task6": { text: "영양제 먹이기", icon: "💊", done: false }
        };

        function updateScreen() {
            const dateStr = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentDate.getDate()).padStart(2, '0');
            document.getElementById('todayDate').innerText = `${currentDate.getMonth() + 1}월 ${currentDate.getDate()}일`;

            if (currentListener) {
                currentListener(); 
            }

            const tasksRef = ref(db, 'seoli_care/' + dateStr);
            
            currentListener = onValue(tasksRef, (snapshot) => {
                let data = snapshot.val();
                if (!data) {
                    data = defaultTasks; 
                }
                renderTasks(data, dateStr);
            });
        }

        function renderTasks(tasks, dateStr) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            for (const [key, task] of Object.entries(tasks)) {
                const div = document.createElement('div');
                div.className = `task-item ${task.done ? 'completed' : ''}`;
                
                div.onclick = () => {
                    set(ref(db, `seoli_care/${dateStr}/${key}`), {
                        ...task,
                        done: !task.done
                    });
                };
                
                div.innerHTML = `
                    <div class="icon-box">${task.icon}</div>
                    <div class="task-text">${task.text}</div>
                    <div class="status">${task.done ? '완료' : '대기중'}</div>
                `;
                list.appendChild(div);
            }
        }

        document.getElementById('prevBtn').onclick = () => {
            currentDate.setDate(currentDate.getDate() - 1);
            updateScreen();
        };
        
        document.getElementById('nextBtn').onclick = () => {
            currentDate.setDate(currentDate.getDate() + 1);
            updateScreen();
        };

        updateScreen();
    </script>
</body>
</html>
