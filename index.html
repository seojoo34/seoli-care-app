<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설이 케어 일지</title>
    <link rel="apple-touch-icon" href="icon.png">
<link rel="shortcut icon" href="icon.png">
<link rel="manifest" href="manifest.json">
    <style>
        /* 국립공원 꼬미 웹 폰트 불러오기 */
        @font-face {
            font-family: 'NationalParkKomi';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/KNPSKkomi-Regular00.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* 폰트 적용 및 기본 디자인 */
        body { 
            font-family: 'NationalParkKomi', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background-color: #FDFBF7; 
            margin: 0; 
            padding: 25px 20px; 
            color: #4A2B1D; 
        }
        
        .header { text-align: center; margin-bottom: 25px; }
        .title { font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        
        /* 날짜 조작부 디자인 */
        .date-control { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .date-btn { background: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; color: #FF9B6A; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; font-family: 'NationalParkKomi'; }
        .date-btn:active { background: #FF9B6A; color: white; }
        .date-display { font-size: 18px; color: #666; font-weight: 700; background: #F0EDE5; padding: 6px 20px; border-radius: 20px; min-width: 110px; }
        
        /* 체크리스트 디자인 */
        .task-list { background: white; border-radius: 24px; padding: 10px 20px; box-shadow: 0 8px 20px rgba(74, 43, 29, 0.04); margin-bottom: 20px; }
        .task-item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px dashed #F0EDE5; cursor: pointer; transition: 0.2s ease-in-out; }
        .task-item:last-child { border-bottom: none; }
        
        .icon-box { width: 46px; height: 46px; background: #F8F6F0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 18px; transition: 0.3s; }
        .task-text { font-size: 20px; font-weight: 700; flex: 1; transition: 0.2s; }
        .status { font-size: 15px; color: #CCC; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: #FAFAFA; }
        
        .task-item.completed .icon-box { background: #FF9B6A; color: white; transform: scale(1.1) rotate(-10deg); box-shadow: 0 4px 10px rgba(255, 155, 106, 0.3); }
        .task-item.completed .task-text { text-decoration: line-through; color: #C4B9B3; }
        .task-item.completed .status { color: white; background: #FF9B6A; }

        /* 메모장 디자인 추가 */
        .memo-section { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 8px 20px rgba(74, 43, 29, 0.04); }
        .memo-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #666; }
        .memo-input { width: 100%; box-sizing: border-box; height: 90px; border: 2px dashed #F0EDE5; border-radius: 12px; padding: 15px; font-family: 'NationalParkKomi', sans-serif; font-size: 18px; color: #4A2B1D; resize: none; outline: none; transition: 0.3s; background: #FAFAFA; }
        .memo-input:focus { border-color: #FF9B6A; background: white; }
        .memo-btn { width: 100%; background: #F0EDE5; color: #666; border: none; padding: 14px; border-radius: 12px; font-size: 18px; font-family: 'NationalParkKomi'; font-weight: 700; margin-top: 12px; cursor: pointer; transition: 0.2s; }
        .memo-btn.active-btn { background: #FF9B6A; color: white; box-shadow: 0 4px 12px rgba(255, 155, 106, 0.3); }
        .memo-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🐾 설이 케어 일지</div>
        <div class="date-control">
            <button class="date-btn" id="prevBtn">◀</button>
            <div class="date-display" id="todayDate">로딩중...</div>
            <button class="date-btn" id="nextBtn">▶</button>
        </div>
    </div>
    
    <div class="task-list" id="taskList">
        </div>

    <div class="memo-section">
        <div class="memo-title">📝 오늘의 메모</div>
        <textarea id="memoInput" class="memo-input" placeholder="오늘 설이의 특이사항을 남겨주세요! (예: 똥 상태 좋음, 산책 30분 함)"></textarea>
        <button id="memoSaveBtn" class="memo-btn">저장하기</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        let currentDate = new Date();
        let currentListener = null;

        const defaultTasks = {
            "task1": { text: "아침 밥 주기", icon: "🥣", done: false },
            "task2": { text: "점심 밥 주기", icon: "🥫", done: false },
            "task3": { text: "저녁 밥 주기", icon: "🍖", done: false },
            "task4": { text: "오늘의 산책", icon: "🦮", done: false },
            "task5": { text: "간식 챙겨주기", icon: "🦴", done: false },
            "task6": { text: "영양제 먹이기", icon: "💊", done: false }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCFTY-sXWWT2ni5Lyq90iFqCvBw8LEuhok",
            authDomain: "seoli-care.firebaseapp.com",
            databaseURL: "https://seoli-care-default-rtdb.firebaseio.com",
            projectId: "seoli-care",
            storageBucket: "seoli-care.firebasestorage.app",
            messagingSenderId: "729701318985",
            appId: "1:729701318985:web:85565cb3354ee3ff959a98"
        };

        function updateDateUI() {
            document.getElementById('todayDate').innerText = `${currentDate.getMonth() + 1}월 ${currentDate.getDate()}일`;
        }

        try {
            updateDateUI();

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.database();

            function updateScreen() {
                updateDateUI();
                const dateStr = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentDate.getDate()).padStart(2, '0');
                
                const tasksRef = db.ref('seoli_care/' + dateStr);
                
                if (currentListener) {
                    currentListener.off(); 
                }

                currentListener = tasksRef;
                currentListener.on('value', (snapshot) => {
                    let savedData = snapshot.val() || {};
                    let dataToRender = { ...defaultTasks }; 
                    
                    for (let key in savedData) {
                        if (dataToRender[key] && key !== 'memo') {
                            dataToRender[key] = savedData[key];
                        }
                    }

                    renderTasks(dataToRender, dateStr);

                    // 사용자가 메모를 입력 중이 아닐 때만 화면에 메모 불러오기
                    const memoInput = document.getElementById('memoInput');
                    if (document.activeElement !== memoInput) {
                        memoInput.value = savedData.memo || '';
                    }
                    
                    // 메모가 비어있으면 저장 버튼 회색, 내용이 있으면 주황색으로 변경
                    checkMemoStatus();
                });
            }

            function renderTasks(tasks, dateStr) {
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                
                for (const [key, task] of Object.entries(tasks)) {
                    const div = document.createElement('div');
                    div.className = `task-item ${task.done ? 'completed' : ''}`;
                    
                    div.onclick = () => {
                        db.ref(`seoli_care/${dateStr}/${key}`).set({
                            ...task,
                            done: !task.done
                        });
                    };
                    
                    div.innerHTML = `
                        <div class="icon-box">${task.icon}</div>
                        <div class="task-text">${task.text}</div>
                        <div class="status">${task.done ? '완료' : '대기중'}</div>
                    `;
                    list.appendChild(div);
                }
            }

            // 날짜 이동 버튼
            document.getElementById('prevBtn').onclick = () => {
                currentDate.setDate(currentDate.getDate() - 1);
                updateScreen();
            };
            
            document.getElementById('nextBtn').onclick = () => {
                currentDate.setDate(currentDate.getDate() + 1);
                updateScreen();
            };

            // 메모장 글씨 쓸 때 버튼 색상 활성화
            const memoInput = document.getElementById('memoInput');
            const memoSaveBtn = document.getElementById('memoSaveBtn');
            
            function checkMemoStatus() {
                if(memoInput.value.trim() !== '') {
                    memoSaveBtn.classList.add('active-btn');
                } else {
                    memoSaveBtn.classList.remove('active-btn');
                }
            }
            memoInput.addEventListener('input', checkMemoStatus);

            // 메모 저장 버튼 클릭 시 파이어베이스에 저장
            memoSaveBtn.onclick = () => {
                const dateStr = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentDate.getDate()).padStart(2, '0');
                const memoText = memoInput.value;
                
                db.ref(`seoli_care/${dateStr}/memo`).set(memoText).then(() => {
                    memoSaveBtn.innerText = '저장 완료! 🐾';
                    setTimeout(() => {
                        memoSaveBtn.innerText = '저장하기';
                    }, 1500);
                });
            };

            updateScreen();

        } catch (error) {
            updateDateUI();
            document.getElementById('taskList').innerHTML = `<div style="text-align:center; padding: 20px; color: red; font-size: 15px; font-family: sans-serif;">❌ 에러 발생:<br>${error.message}</div>`;
        }
    </script>
</body>
</html>
